name: App Android pocket_bot

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android_build.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Pruebas del núcleo (estrategia, backtest, protocolo)
        working-directory: android
        run: gradle -p core test
      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleRelease
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PocketBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBot-android
          path: PocketBot.apk
          retention-days: 30
